  <rect x="988" y="116" width="200" height="44" rx="7" fill="#302b3d" stroke="#6c7086"/>
  <text x="1088" y="143" fill="#cdd6f4" font-size="13" text-anchor="middle">ipc-channels.ts</text>
  <rect x="1200" y="116" width="220" height="44" rx="7" fill="#302b3d" stroke="#6c7086"/>
  <text x="1310" y="143" fill="#cdd6f4" font-size="13" text-anchor="middle">and-filter.ts (AND/NOT)</text>
  <rect x="988" y="172" width="432" height="44" rx="7" fill="#302b3d" stroke="#6c7086"/>
  <text x="1204" y="199" fill="#cdd6f4" font-size="13" text-anchor="middle">backlog-types · copilot-types · diff-types · worktree-types</text>
