  <text x="271" y="328" fill="#a6adc8" font-size="11" text-anchor="middle">CommandPalette · TranscriptPanel · DiffReview</text>

  <rect x="482" y="290" width="424" height="50" rx="7" fill="#2a2b3c" stroke="#585b70"/>
