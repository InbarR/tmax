  <rect x="40" y="456" width="900" height="64" rx="12" fill="#3a3320" stroke="#fab387" stroke-width="1.5"/>
  <text x="60" y="480" fill="#fab387" font-size="15" font-weight="700">PRELOAD  ·  src/preload</text>
  <text x="60" y="503" fill="#cdd6f4" font-size="13">window.terminalAPI  —  contextBridge (frozen)  ·  ipcRenderer.invoke / on  ·  the ONLY renderer↔OS boundary</text>

