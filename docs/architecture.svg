  <rect x="0" y="0" width="1480" height="1060" fill="#1e1e2e"/>
  <text x="40" y="46" fill="#cdd6f4" font-size="26" font-weight="700">tmax architecture</text>
  <text x="245" y="46" fill="#7f849c" font-size="16">— Electron: Renderer (React) ⇄ Preload (contextBridge) ⇄ Main (Node)</text>

  <!-- ================= RENDERER ================= -->
  <rect x="40" y="74" width="900" height="356" rx="12" fill="#26273a" stroke="#585b70" stroke-width="1.5"/>
  <text x="60" y="100" fill="#89b4fa" font-size="16" font-weight="700">RENDERER — React  ·  src/renderer</text>

  <rect x="60" y="116" width="180" height="46" rx="7" fill="#313244" stroke="#6c7086"/>
  <text x="150" y="138" fill="#cdd6f4" font-size="14" text-anchor="middle">index → App.tsx</text>
  <text x="150" y="154" fill="#7f849c" font-size="11" text-anchor="middle">+ DetachedApp</text>

  <rect x="252" y="116" width="220" height="46" rx="7" fill="#313244" stroke="#6c7086"/>
  <text x="362" y="137" fill="#cdd6f4" font-size="14" text-anchor="middle" font-weight="600">terminal-store (Zustand)</text>
  <text x="362" y="153" fill="#7f849c" font-size="11" text-anchor="middle">panes · layout · workspaces · sessions</text>

  <rect x="484" y="116" width="200" height="46" rx="7" fill="#313244" stroke="#6c7086"/>
  <text x="584" y="137" fill="#cdd6f4" font-size="14" text-anchor="middle">terminal-registry</text>
  <text x="584" y="153" fill="#7f849c" font-size="11" text-anchor="middle">live xterm instances (outside React)</text>

  <rect x="696" y="116" width="224" height="46" rx="7" fill="#313244" stroke="#6c7086"/>
  <text x="808" y="137" fill="#cdd6f4" font-size="14" text-anchor="middle">hooks / useKeybindings</text>
  <text x="808" y="153" fill="#7f849c" font-size="11" text-anchor="middle">shortcuts · command palette</text>

  <!-- components -->
  <rect x="60" y="182" width="860" height="232" rx="9" fill="#1e1e2e" stroke="#45475a"/>
  <text x="74" y="202" fill="#94e2d5" font-size="13" font-weight="700">components (35)</text>

  <rect x="74" y="214" width="180" height="58" rx="7" fill="#363a4f" stroke="#fab387" stroke-width="1.5"/>
  <text x="164" y="238" fill="#cdd6f4" font-size="14" text-anchor="middle" font-weight="600">TerminalPanel</text>
  <text x="164" y="256" fill="#a6adc8" font-size="11" text-anchor="middle">xterm.js · mouse · paste</text>

  <rect x="268" y="214" width="200" height="58" rx="7" fill="#363a4f" stroke="#6c7086"/>
